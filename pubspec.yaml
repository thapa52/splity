name: splity
description: "Splity - Smart Bill Splitter. Split expenses with friends and groups."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  # STATE MANAGEMEN
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # NAVIGATION 
  go_router: ^17.0.0

  # UI 
  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # CODE GENERATION
  build_runner: ^2.7.1
  riverpod_generator: ^4.0.0+1
  
  # LINTING 
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true